version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hims_kb_web
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn --bind 0.0.0.0:8000 --workers 3 --threads 2 hims_kb.wsgi:application
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=hims_kb.settings
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-change-me}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - POSTGRES_DB=${POSTGRES_DB:-hims_kb_db}
      - POSTGRES_USER=${POSTGRES_USER:-hims_kb_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hims_kb_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    container_name: hims_kb_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hims_kb_db}
      - POSTGRES_USER=${POSTGRES_USER:-hims_kb_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hims_kb_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hims_kb_user} -d ${POSTGRES_DB:-hims_kb_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hims_kb_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: