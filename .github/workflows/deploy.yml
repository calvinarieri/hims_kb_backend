name: CI/CD Pipeline - Test, Build & Deploy to VPS Kubernetes

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. CI JOB: Test & Lint
  # ============================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Unit Tests
        env:
          SECRET_KEY: 'django-insecure-ci-test-key-for-github-actions'
          DEBUG: 'False'
          POSTGRES_DB: 'hims_kb_test'
          POSTGRES_USER: 'hims_kb_user'
          POSTGRES_PASSWORD: 'hims_kb_password'
          POSTGRES_HOST: '127.0.0.1'
          POSTGRES_PORT: '5432'
          REDIS_HOST: '127.0.0.1'
          REDIS_PORT: '6379'
        run: |
          python manage.py test articles authentication product github --settings=hims_kb.test_settings

  # ============================================================================
  # 2. CD JOB: Build Image & Deploy to VPS Kubernetes Cluster
  # ============================================================================
  deploy:
    name: Build Image & Deploy to VPS Kubernetes
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build & Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS Kubernetes Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "==== Logged into VPS ===="
            
            # Ensure kubectl is configured for namespace
            kubectl apply -f https://raw.githubusercontent.com/calvinarieri/hims_kb_backend/main/k8s/namespace.yaml || true
            
            # Inject GitHub Secrets into Kubernetes Secret
            kubectl create secret generic hims-kb-secrets \
              --namespace=hims-kb \
              --from-literal=SECRET_KEY='${{ secrets.SECRET_KEY }}' \
              --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER || 'hims_kb_user' }}' \
              --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
              --from-literal=OPENROUTER_API_KEY='${{ secrets.OPENROUTER_API_KEY }}' \
              --from-literal=OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
              --from-literal=RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}' \
              --dry-run=client -o yaml | kubectl apply -f -

            # Apply ConfigMap, Storage, Services, and Deployment
            kubectl apply -f https://raw.githubusercontent.com/calvinarieri/hims_kb_backend/main/k8s/configmap.yaml
            kubectl apply -f https://raw.githubusercontent.com/calvinarieri/hims_kb_backend/main/k8s/postgres.yaml
            kubectl apply -f https://raw.githubusercontent.com/calvinarieri/hims_kb_backend/main/k8s/redis.yaml
            kubectl apply -f https://raw.githubusercontent.com/calvinarieri/hims_kb_backend/main/k8s/service.yaml
            kubectl apply -f https://raw.githubusercontent.com/calvinarieri/hims_kb_backend/main/k8s/ingress.yaml
            kubectl apply -f https://raw.githubusercontent.com/calvinarieri/hims_kb_backend/main/k8s/deployment.yaml

            # Trigger deployment update to latest image SHA
            IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            kubectl set image deployment/hims-kb-backend hims-kb-backend=${IMAGE_TAG} --namespace=hims-kb

            # Execute database migrations inside the active pod
            echo "==== Running Database Migrations ===="
            kubectl rollout status deployment/hims-kb-backend --namespace=hims-kb --timeout=180s
            POD_NAME=$(kubectl get pods -n hims-kb -l app=hims-kb-backend -o jsonpath='{.items[0].metadata.name}')
            kubectl exec -n hims-kb ${POD_NAME} -- python manage.py migrate --noinput
            kubectl exec -n hims-kb ${POD_NAME} -- python manage.py collectstatic --noinput

            echo "==== Zero-Downtime Rollout Verification Successful ===="

